[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-trainer-local"
version = "0.4.1"
description = "Local-first Codeforces and AtCoder training planner, contest generator, and practice rating tracker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = []

[project.scripts]
cp-trainer = "cptrainer.cli:main"
cp-trainer-web = "cptrainer.web:main"
cp-trainer-archive = "cptrainer.archive:main"
cp-trainer-testdata = "cptrainer.testdata:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cptrainer*"]

[tool.setuptools.package-data]
cptrainer = ["static/**/*"]
